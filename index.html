<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presupuesto Muñoz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Presupuesto Muñoz</h1>
    <p id="estado-carga">Cargando datos…</p>
  </header>

  <main>
    <section id="resumen-section">
      <h2>Resumen 50/30/20</h2>
      <table id="resumen-tabla">
        <thead>
          <tr><th>Bucket</th><th>Objetivo</th><th>Real</th><th>% real</th><th>Estado</th></tr>
        </thead>
        <tbody id="resumen-buckets"></tbody>
      </table>
      <p id="resumen-totales"></p>
    </section>

    <section id="colchon-section">
      <h2>Colchón</h2>
      <dl id="colchon-datos"></dl>
    </section>

    <section id="proyeccion-section">
      <h2>Proyección del colchón</h2>

      <div id="controles">
        <label for="slider-mes">
          Media jornada empieza en el mes <strong id="mes-label">—</strong>
        </label>
        <input type="range" id="slider-mes" min="1" max="36" value="36">

        <label for="input-ingreso-mj">Ingreso durante media jornada (€/mes)</label>
        <input type="number" id="input-ingreso-mj" min="0" step="10">
      </div>

      <p id="proyeccion-nota"></p>
      <canvas id="proyeccion-chart" height="200"></canvas>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
